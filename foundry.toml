[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# paris = no PUSH0 opcode, so the exact same bytecode deploys on every supported chain
# (some newer EVM chains still lag behind Shanghai/Cancun).
evm_version = "paris"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"   # deterministic bytecode -> same CREATE2 address on every chain
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 10_000
seed = "0xb01"

[invariant]
runs = 512
depth = 64
fail_on_revert = false

# Heavier settings for a pre-deploy run: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 100_000
[profile.deep.invariant]
runs = 2_000
depth = 128

# SetPricing only (it deploys nothing): simulate with a newer EVM so feeds compiled with PUSH0
# (e.g. Robinhood Chain's) run locally. Separate out/cache so deploy artifacts stay paris.
[profile.pricing]
evm_version = "cancun"
out = "out-pricing"
cache_path = "cache-pricing"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
ethereum = "${ETHEREUM_RPC_URL}"
bsc = "${BSC_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
elysium = "${ELYSIUM_RPC_URL}"
anvil = "http://127.0.0.1:8545"
